<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Manage Prompts - Gemini Tool</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #0a0a0a;
        color: #fff;
        min-height: 100vh;
        scrollbar-width: thin;
        scrollbar-color: transparent transparent;
      }
      body:hover {
        scrollbar-color: #325a93 #0f172a;
      }
      *::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      *::-webkit-scrollbar-track {
        background: transparent;
        border-radius: 999px;
      }
      *::-webkit-scrollbar-thumb {
        background: transparent;
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      body:hover *::-webkit-scrollbar-track {
        background: #0f172a;
      }
      body:hover *::-webkit-scrollbar-thumb {
        background: #325a93;
      }
      *::-webkit-scrollbar-thumb:hover {
        background: #4285f4;
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 32px;
        height: 58px;
        background: #0f0f0f;
        border-bottom: 1px solid #1e1e1e;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .topbar-logo {
        font-size: 20px;
      }
      .topbar-title {
        font-size: 15px;
        font-weight: 600;
      }
      .topbar-sub {
        font-size: 12px;
        color: #555;
        margin-left: 2px;
      }
      .container {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 24px 60px;
      }

      .prompt-card {
        background: #141414;
        border: 1px solid #222;
        border-radius: 12px;
        padding: 16px 18px;
        margin-bottom: 12px;
        transition: border-color 0.15s;
      }
      .prompt-card.is-default {
        border-color: #4285f4;
      }
      .card-top {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .card-label {
        font-size: 14px;
        font-weight: 500;
      }
      .default-badge {
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 20px;
        background: rgba(66, 133, 244, 0.15);
        color: #4285f4;
        border: 1px solid rgba(66, 133, 244, 0.25);
      }
      .card-preview {
        font-size: 12px;
        color: #555;
        line-height: 1.5;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        margin-bottom: 10px;
      }
      .card-actions {
        display: flex;
        gap: 6px;
      }

      .btn {
        padding: 6px 12px;
        border-radius: 7px;
        border: 1px solid #2a2a2a;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.12s;
      }
      .btn-ghost {
        background: transparent;
        color: #777;
      }
      .btn-ghost:hover {
        color: #fff;
        border-color: #444;
      }
      .btn-danger {
        background: transparent;
        color: #f44336;
      }
      .btn-danger:hover {
        background: rgba(244, 67, 54, 0.1);
      }
      .btn-primary {
        background: #4285f4;
        color: #fff;
        border-color: #4285f4;
      }
      .btn-primary:hover {
        background: #3367d6;
      }
      .btn-add {
        width: 100%;
        padding: 11px;
        border-radius: 10px;
        border: 1px dashed #2a2a2a;
        background: transparent;
        color: #555;
        font-size: 13px;
        font-family: inherit;
        cursor: pointer;
        margin-top: 4px;
        transition: all 0.12s;
      }
      .btn-add:hover {
        color: #fff;
        border-color: #444;
      }

      .editor {
        background: #141414;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
      }
      .editor-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .editor-title {
        font-size: 14px;
        font-weight: 500;
      }
      .field-label {
        display: block;
        font-size: 11px;
        color: #555;
        margin-bottom: 5px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      input[type='text'],
      textarea {
        width: 100%;
        padding: 9px 11px;
        border-radius: 8px;
        border: 1px solid #2a2a2a;
        background: #0f0f0f;
        color: #fff;
        font-size: 13px;
        font-family: inherit;
        outline: none;
        margin-bottom: 12px;
      }
      input:focus,
      textarea:focus {
        border-color: #4285f4;
      }
      textarea {
        resize: vertical;
        line-height: 1.5;
      }
      .editor-footer {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .status {
        font-size: 12px;
        color: #f44336;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <span class="topbar-logo">✨</span>
      <span class="topbar-title">Manage Prompts</span>
      <span class="topbar-sub"
        >Saved prompts appear in the picker when you hover any image</span
      >
    </div>

    <div class="container">
      <div id="editorWrap" style="display: none"></div>
      <div id="promptList"></div>
      <button class="btn-add" id="btnAdd">+ New prompt</button>
      <div class="status" id="status"></div>
    </div>

    <script src="promptsApi.js"></script>
    <script src="prompts.js"></script>
  </body>
</html>
